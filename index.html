let videos = [];
let activeTag = "";
let activeActress = "";
let currentVideoId = null;

function escapeHTML(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function parseTags(v) {
  if (Array.isArray(v)) {
    return [...new Set(v.map(x => String(x).trim()).filter(Boolean))];
  }

  return [...new Set(
    String(v || "")
      .split(/[,\u3001\n\r]+/)
      .map(x => x.trim())
      .filter(Boolean)
  )];
}

function toMillis(v) {
  if (v === undefined || v === null || v === "") return Date.now();

  const n = Number(v);
  if (Number.isFinite(n) && n > 0) return n;

  const d = Date.parse(v);
  return Number.isFinite(d) ? d : Date.now();
}

function normaliseVideo(v) {
  const s = v || {};

  return {
    id: String(s.id ?? ""),
    title: String(s.title || s.name || "無題の動画"),
    url: String(s.url || s.videoUrl || ""),
    thumbnail: String(s.thumbnail || s.thumbnailUrl || s.image || ""),
    tags: parseTags(s.tags || s.tag || ""),
    actresses: parseTags(s.actresses || s.actress || s.performers || s.cast || ""),
    description: String(s.description || s.desc || ""),
    views: Number(s.views ?? 0),
    createdAt: toMillis(s.created_at || s.createdAt || s.created || s.timestamp),
    updatedAt: s.updated_at || s.updatedAt
      ? toMillis(s.updated_at || s.updatedAt)
      : null
  };
}

function notify(message) {
  const el = $("toast");
  el.textContent = message;
  el.classList.remove("hidden");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    el.classList.add("hidden");
  }, 3000);
}

function resolveThumbnail(value) {
  const raw = String(value || "").trim();

  if (!raw) return "";

  if (
    /^https?:\/\//i.test(raw) ||
    /^data:image\//i.test(raw) ||
    /^blob:/i.test(raw)
  ) {
    return raw;
  }

  let path = raw.replace(/^\/+/, "");

  if (path.startsWith(STORAGE_BUCKET + "/")) {
    path = path.slice(STORAGE_BUCKET.length + 1);
  }

  if (!path) return "";

  try {
    return client.storage
      .from(STORAGE_BUCKET)
      .getPublicUrl(path)?.data?.publicUrl || "";
  } catch(error) {
    console.error("サムネイルURLの生成に失敗しました:", error);
    return "";
  }
}

function getVideoPageUrl(id) {
  const url = new URL(SITE_URL);
  url.searchParams.set("video", String(id));
  return url.href;
}

function setMeta(selector, value) {
  const element = document.querySelector(selector);
  if (element) element.content = String(value ?? "");
}

function setRobots(indexable) {
  setMeta(
    'meta[name="robots"]',
    indexable
      ? "index,follow,max-image-preview:large,max-video-preview:-1"
      : "noindex,follow"
  );
}

function setStructuredData(data) {
  $("videoStructuredData").textContent = JSON.stringify(data);
}

function getVideoDescription(video) {
  const description = String(video.description || "").trim();

  if (description) return description.slice(0, 300);

  const details = [
    video.title,
    video.actresses.length
      ? "出演者：" + video.actresses.join("、")
      : "",
    video.tags.length
      ? "タグ：" + video.tags.join("、")
      : ""
  ].filter(Boolean);

  return (
    details.join("。") +
    "。素人ちゃんねるで動画の詳細を確認できます。"
  ).slice(0, 300);
}

function getEmbedUrl(videoUrl) {
  if (!isSafeHttpUrl(videoUrl)) return "";

  const youtubeId = getYouTubeId(videoUrl);

  if (youtubeId) {
    return "https://www.youtube.com/embed/" +
      encodeURIComponent(youtubeId);
  }

  /*
   * 外部サイトの通常の閲覧ページを
   * 埋め込み動画URLとして誤登録しない。
   * 埋め込み可能か確認できないURLは省略する。
   */
  return "";
}

function updateMetaForHome() {
  document.title = SITE_NAME;
  document.documentElement.lang = "ja";

  setRobots(true);

  setMeta('meta[name="description"]', HOME_DESCRIPTION);
  $("canonicalUrl").href = SITE_URL;

  setMeta('meta[property="og:title"]', SITE_NAME);
  setMeta('meta[property="og:description"]', HOME_DESCRIPTION);
  setMeta('meta[property="og:type"]', "website");
  setMeta('meta[property="og:url"]', SITE_URL);
  setMeta('meta[property="og:image"]', "");

  setMeta('meta[name="twitter:card"]', "summary_large_image");
  setMeta('meta[name="twitter:title"]', SITE_NAME);
  setMeta('meta[name="twitter:description"]', HOME_DESCRIPTION);
  setMeta('meta[name="twitter:image"]', "");

  setStructuredData({
    "@context":"https://schema.org",
    "@type":"WebSite",
    "name":SITE_NAME,
    "url":SITE_URL,
    "inLanguage":"ja"
  });
}

function updateMetaForVideo(video) {
  const title = video.title + " | " + SITE_NAME;
  const description = getVideoDescription(video);
  const pageUrl = getVideoPageUrl(video.id);
  const thumbnail = getThumbnail(video);
  const embedUrl = getEmbedUrl(video.url);

  document.title = title;
  document.documentElement.lang = "ja";

  setRobots(true);

  setMeta('meta[name="description"]', description);
  $("canonicalUrl").href = pageUrl;

  setMeta('meta[property="og:title"]', title);
  setMeta('meta[property="og:description"]', description);
  setMeta('meta[property="og:type"]', "article");
  setMeta('meta[property="og:url"]', pageUrl);
  setMeta('meta[property="og:image"]', thumbnail);

  setMeta(
    'meta[name="twitter:card"]',
    thumbnail ? "summary_large_image" : "summary"
  );
  setMeta('meta[name="twitter:title"]', title);
  setMeta('meta[name="twitter:description"]', description);
  setMeta('meta[name="twitter:image"]', thumbnail);

  const videoSchema = {
    "@context":"https://schema.org",
    "@type":"VideoObject",
    "name":video.title,
    "description":description,
    "uploadDate":new Date(video.createdAt).toISOString(),
    "url":pageUrl,
    "inLanguage":"ja",
    "isFamilyFriendly":false,
    "interactionStatistic":{
      "@type":"InteractionCounter",
      "interactionType":{"@type":"WatchAction"},
      "userInteractionCount":Math.max(0, Number(video.views) || 0)
    },
    "publisher":{
      "@type":"Organization",
      "name":SITE_NAME,
      "url":SITE_URL
    },
    "mainEntityOfPage":{
      "@type":"WebPage",
      "@id":pageUrl
    }
  };

  if (thumbnail && isSafeHttpUrl(thumbnail)) {
    videoSchema.thumbnailUrl = [thumbnail];
    videoSchema.image = thumbnail;
  }

  if (embedUrl) {
    videoSchema.embedUrl = embedUrl;
  }

  if (video.tags.length) {
    videoSchema.keywords = video.tags.join(", ");
  }

  if (video.actresses.length) {
    videoSchema.actor = video.actresses.map(name => ({
      "@type":"Person",
      "name":name
    }));
  }

  if (video.updatedAt) {
    videoSchema.dateModified =
      new Date(video.updatedAt).toISOString();
  }

  setStructuredData(videoSchema);
}

function updateMetaForMissingVideo() {

  );

function isSafeHttpUrl(value) {
  try {
    const url = new URL(value);
    return ["http:","https:"].includes(url.protocol);
  } catch(e) {
    return false;
  }
}

async function loadVideos() {
  const { data, error } = await client
    .from("videos")
    .select("id,created_at,title,url,thumbnail,actress,tags,description,sort_order,views")
    .order("sort_order", { ascending: false });

  if (error) {
    console.error(error);
    notify("動画データの読み込みに失敗しました");
    return;
  }

  videos = (data || []).map(normaliseVideo);

  render();

  const params = new URLSearchParams(window.location.search);
  const requestedVideoId = params.get("video");

  if (requestedVideoId) {
    const video = videos.find(v => String(v.id) === requestedVideoId);

    if (video) {
      showVideoPage(video, false, true);
    } else {
      showListingPage(false);
      updateMetaForMissingVideo();
      notify("指定された動画が見つかりませんでした");
    }
  } else {
    showListingPage(false);
  }
}

function getAllTags() {
  const m = new Map();

  videos.forEach(v => {
    v.tags.forEach(t => {
      m.set(t, (m.get(t) || 0) + 1);
    });
  });

  return [...m.entries()].sort((a,b) =>
    a[0].localeCompare(b[0], "ja")
  );
}

function getAllActresses() {
  const m = new Map();

  videos.forEach(v => {
    v.actresses.forEach(t => {
      m.set(t, (m.get(t) || 0) + 1);
    });
  });

  return [...m.entries()].sort((a,b) =>
    a[0].localeCompare(b[0], "ja")
  );
}

function renderTags() {
  const tags = getAllTags();
  const list = $("tagList");
  const q = $("tagSearchInput").value.trim().toLocaleLowerCase();

  list.innerHTML = "";

  const all = document.createElement("button");
  all.className = "tag-chip" + (!activeTag ? " active" : "");
  all.textContent = "すべて";

  all.onclick = () => {
    activeTag = "";
    render();
  };

  list.appendChild(all);

  const visible = tags.filter(([t]) =>
    t.toLocaleLowerCase().includes(q)
  );

  visible.forEach(([tag,count]) => {
    const b = document.createElement("button");

    b.className = "tag-chip" + (activeTag === tag ? " active" : "");
    b.innerHTML =
      `${escapeHTML(tag)} <span class="count">${count}</span>`;

    b.onclick = () => {
      activeTag = activeTag === tag ? "" : tag;
      render();
    };

    list.appendChild(b);
  });

  if (!visible.length) {
    const e = document.createElement("span");
    e.textContent = tags.length
      ? "一致するタグがありません。"
      : "まだタグはありません。";

    list.appendChild(e);
  }
}

function renderActresses() {
  const names = getAllActresses();
  const list = $("actressList");
  const q = $("actressSearchInput").value.trim().toLocaleLowerCase();

  list.innerHTML = "";

  const all = document.createElement("button");
  all.className =
    "actress-chip" + (!activeActress ? " active" : "");
  all.textContent = "すべて";

  all.onclick = () => {
    activeActress = "";
    render();
  };

  const visible = names.filter(([n]) =>
    n.toLocaleLowerCase().includes(q)
  );

    b.className =
      "actress-chip" + (activeActress === name ? " active" : "");

      `${escapeHTML(name)} <span class="count">${count}</span>`;

      render();
    };

function getFilteredVideos() {
  const q = $("searchInput").value.trim().toLocaleLowerCase();

  let list = videos.filter(v => {
    if (activeTag && !v.tags.includes(activeTag)) return false;
    if (activeActress && !v.actresses.includes(activeActress)) return false;

    if (
      q &&
      ![
        v.title,
        v.description,
        v.url,
        ...v.tags,
        ...v.actresses
      ].join(" ").toLocaleLowerCase().includes(q)
    ) {
      return false;
    }

    return true;
  });

  const sort = $("sortSelect").value;

  if (sort === "newest") {
    list.sort((a,b) => b.createdAt - a.createdAt);
  }

  if (sort === "oldest") {
    list.sort((a,b) => a.createdAt - b.createdAt);
  }

  if (sort === "title") {
    list.sort((a,b) => a.title.localeCompare(b.title, "ja"));
  }

  if (sort === "popular") {
    list.sort((a,b) =>
      (b.views || 0) - (a.views || 0) ||
      b.createdAt - a.createdAt
    );
  }

  return list;
}

function getYouTubeId(url) {
  try {
    const p = new URL(url);
    const h = p.hostname.replace(/^www\./, "");

    if (h === "youtu.be") {
      return p.pathname.split("/").filter(Boolean)[0] || "";
    }

    if (
      h === "youtube.com" ||
      h.endsWith(".youtube.com") ||
      h === "youtube-nocookie.com" ||
      h.endsWith(".youtube-nocookie.com")
    ) {
      if (p.searchParams.get("v")) {
        return p.searchParams.get("v");
      }

      const a = p.pathname.split("/").filter(Boolean);

      if (["embed","shorts","live","v"].includes(a[0])) {
        return a[1] || "";
      }
    }
  } catch(e) {}

  return "";
}

function getThumbnail(v) {
  const stored = resolveThumbnail(v.thumbnail);

  if (stored) return stored;

  const id = getYouTubeId(v.url);

  return id
    ? `https://img.youtube.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`
    : "";
}

function createVideoCard(v) {
  const card = document.createElement("article");
  card.className = "video-card";

  const pageUrl = getVideoPageUrl(v.id);

  const wrap = document.createElement("div");
  wrap.className = "thumb-wrap";

  const link = document.createElement("a");
  link.href = pageUrl;
  link.setAttribute("aria-label", v.title);
  link.style.display = "block";
  link.style.width = "100%";
  link.style.height = "100%";

  const src = getThumbnail(v);

  if (src) {
    const img = document.createElement("img");

    img.className = "thumbnail";
    img.src = src;
    img.alt = v.title;
    img.loading = "lazy";

    img.onerror = () => {
      img.remove();

      const ph = document.createElement("div");
      ph.className = "thumb-placeholder";
      ph.textContent = "▶";

      link.appendChild(ph);
    };

    link.appendChild(img);
  } else {
    const ph = document.createElement("div");

    ph.className = "thumb-placeholder";
    ph.textContent = "▶";

    link.appendChild(ph);
  }

  link.addEventListener("click", e => {
    if (
      e.ctrlKey ||
      e.metaKey ||
      e.shiftKey ||
      e.altKey ||
      e.button !== 0
    ) return;

    e.preventDefault();
    showVideoPage(v, true, false);
  });

  wrap.appendChild(link);

  const info = document.createElement("div");
  info.className = "video-info";

  const title = document.createElement("h3");
  title.className = "video-title";

  const titleLink = document.createElement("a");
  titleLink.href = pageUrl;
  titleLink.textContent = v.title;
  titleLink.style.color = "inherit";
  titleLink.style.textDecoration = "none";

  titleLink.addEventListener("click", e => {
    if (
      e.ctrlKey ||
      e.metaKey ||
      e.shiftKey ||
      e.altKey ||
      e.button !== 0
    ) return;

    e.preventDefault();
    showVideoPage(v, true, false);
  });

  title.appendChild(titleLink);

  const meta = document.createElement("div");
  meta.className = "video-meta";

  const date = document.createElement("span");
  date.textContent =
    new Date(v.createdAt).toLocaleDateString("ja-JP");

  const views = document.createElement("span");
  views.textContent = `閲覧 ${v.views || 0}回`;
  views.dataset.viewsFor = String(v.id);

  meta.append(date, views);
  info.append(title, meta);

  card.append(wrap, info);

  return card;
}

function render() {
  renderTags();
  renderActresses();

  const list = getFilteredVideos();

  const gridTop = $("videoGridTop");
  const gridBottom = $("videoGridBottom");

  gridTop.innerHTML = "";
  gridBottom.innerHTML = "";

  $("resultCount").textContent =
    `${list.length}本の動画` +
    `${activeTag ? " ・タグ：" + activeTag : ""}` +
    `${activeActress ? " ・出演女優：" + activeActress : ""}`;

  $("emptyState").classList.toggle(
    "hidden",
    list.length !== 0
  );

  list.slice(0,4).forEach(v => {
    gridTop.appendChild(createVideoCard(v));
  });

  list.slice(4).forEach(v => {
    gridBottom.appendChild(createVideoCard(v));
  });
}

function createFilterButton(text, cls, fn) {
  const b = document.createElement("button");

  b.className = cls;
  b.textContent = text;
  b.onclick = fn;

  return b;
}

function updateViewDisplays(video) {
  document.querySelectorAll("[data-views-for]").forEach(el => {
    if (el.dataset.viewsFor === String(video.id)) {
      el.textContent = `閲覧 ${video.views || 0}回`;
    }
  });

  if (
    currentVideoId !== null &&
    String(currentVideoId) === String(video.id)
  ) {
    $("videoPageMeta").textContent =
      new Date(video.createdAt).toLocaleDateString("ja-JP") +
      " ・ 累計閲覧 " + (video.views || 0) + "回";

    $("detailMeta").textContent =
      new Date(video.createdAt).toLocaleDateString("ja-JP") +
      " ・ 累計閲覧 " + (video.views || 0) + "回";
  }
}

async function incrementVideoViews(video) {
  const id = String(video.id);

  if (pendingViewUpdates.has(id)) {
    return pendingViewUpdates.get(id);
  }

  const request = (async () => {
    const { data, error } = await client.rpc(
      "increment_video_views",
      {
        video_id: Number(id)
      }
    );

    if (error) {
      console.error("閲覧数の加算に失敗しました:", error);
      return;
    }

    let updatedViews;

    if (
      typeof data === "number" ||
      typeof data === "string"
    ) {
      updatedViews = Number(data);

    } else if (Array.isArray(data) && data.length) {
      updatedViews =
        Number(data[0]?.views ?? data[0]);

    } else if (data && typeof data === "object") {
      updatedViews =
        Number(data.views ?? data.increment_video_views);
    }

    if (!Number.isFinite(updatedViews)) {
      console.error(
        "RPCの戻り値から閲覧数を取得できません:",
        data
      );
      return;
    }

    video.views = updatedViews;
    updateViewDisplays(video);

    if ($("sortSelect").value === "popular") {
      render();
    }

    return updatedViews;
  })();

  pendingViewUpdates.set(id, request);

  try {
    return await request;
  } finally {
    pendingViewUpdates.delete(id);
  }
}

function addVideoTags(container, items, className) {
  container.innerHTML = "";

  if (!items.length) {
    container.textContent = "登録されていません。";
    return;
  }

  items.forEach(item => {
    const button = createFilterButton(
      item,
      className,
      () => {
        if (className === "tag-chip") {
          activeTag = item;
        } else {
          activeActress = item;
        }

        showListingPage(true);
        render();

        window.scrollTo({
          top:0,
          behavior:"smooth"
        });
      }
    );

    container.appendChild(button);
  });
}

function showVideoPage(video, pushHistory, countView) {
  if (!video) return;

  currentVideoId = video.id;
  currentPageMode = "video";

  if (pushHistory) {
    history.pushState(
      {page:"video",videoId:String(video.id)},
      "",
      getVideoPageUrl(video.id)
    );
  }

  hideModal("detailModal");

  $("listingPage").classList.add("hidden");
  $("videoPage").classList.remove("hidden");
  $("headerSearchArea").classList.add("hidden");

  $("videoPageTitle").textContent = video.title;

  $("videoPageMeta").textContent =
    new Date(video.createdAt).toLocaleDateString("ja-JP") +
    " ・ 累計閲覧 " + (video.views || 0) + "回";

  $("videoPageDescription").textContent =
    video.description || "説明はありません。";

  const thumbnailArea = $("videoPageThumbnail");
  thumbnailArea.innerHTML = "";

  const thumbnail = getThumbnail(video);

  if (thumbnail) {
    const img = document.createElement("img");

    img.className = "detail-thumbnail";
    img.src = thumbnail;
    img.alt = video.title;
    img.loading = "eager";

    img.onerror = () => {
      img.remove();

      const placeholder = document.createElement("div");
      placeholder.className = "detail-no-thumbnail";
      placeholder.textContent = "▶";

      thumbnailArea.appendChild(placeholder);
    };

    thumbnailArea.appendChild(img);
  } else {
    const placeholder = document.createElement("div");
    placeholder.className = "detail-no-thumbnail";
    placeholder.textContent = "▶";

    thumbnailArea.appendChild(placeholder);
  }

  addVideoTags(
    $("videoPageTags"),
    video.tags,
    "tag-chip"
  );

  addVideoTags(
    $("videoPageActresses"),
    video.actresses,
    "actress-chip"
  );

  const openButton = $("videoPageOpenButton");

  if (isSafeHttpUrl(video.url)) {
    openButton.href = video.url;
    openButton.classList.remove("hidden");
  } else {
    openButton.href = "#";
    openButton.classList.add("hidden");
  }

  updateMetaForVideo(video);

  if (
    countView &&
    !countedVideoIds.has(String(video.id))
  ) {
    countedVideoIds.add(String(video.id));
    incrementVideoViews(video);
  }

  window.scrollTo({
    top:0,
    behavior:"instant"
  });
}

function showListingPage(pushHistory) {
  currentPageMode = "listing";
  currentVideoId = null;

  if (pushHistory) {
    history.pushState(
      {page:"listing"},
      "",
      SITE_URL
    );
  }

  $("listingPage").classList.remove("hidden");
  $("videoPage").classList.add("hidden");
  $("headerSearchArea").classList.remove("hidden");

  hideModal("detailModal");

  updateMetaForHome();

  window.scrollTo({
    top:0,
    behavior:"instant"
  });
}

    "tag-chip"
  );

  addVideoTags(
    $("detailActresses"),
    v.actresses,
    "actress-chip"
  );

  $("detailOpenButton").onclick = () => {
    if (isSafeHttpUrl(v.url)) {
      window.location.assign(v.url);
    } else {
      notify("登録された動画URLを確認してください");
    }
  };

  $("detailPageButton").onclick = () => {
    hideModal("detailModal");
    showVideoPage(v, true, true);
  };

  $("detailBackButton").onclick = () => {
    hideModal("detailModal");
  };

  showModal("detailModal");
}

function showModal(id) {
  $(id).classList.remove("hidden");
}

function hideModal(id) {
  $(id).classList.add("hidden");
}

$("videoPageBack").addEventListener("click", e => {
  e.preventDefault();
  showListingPage(true);
});

$("searchInput").addEventListener("input", render);
$("tagSearchInput").addEventListener("input", renderTags);
$("actressSearchInput").addEventListener("input", renderActresses);
$("sortSelect").addEventListener("change", render);

$("clearFiltersButton").onclick = () => {
  activeTag = "";
  activeActress = "";

  $("searchInput").value = "";
  $("tagSearchInput").value = "";
  $("actressSearchInput").value = "";
  $("sortSelect").value = "newest";

  render();
};

$("homeLogo").onclick = () => {
  activeTag = "";
  activeActress = "";

  $("searchInput").value = "";
  $("tagSearchInput").value = "";
  $("actressSearchInput").value = "";
  $("sortSelect").value = "newest";

  render();
  showListingPage(true);
};

document.querySelectorAll("[data-close]").forEach(b => {
  b.onclick = () => hideModal(b.dataset.close);
});

document.querySelectorAll(".modal").forEach(m => {
  m.addEventListener("click", e => {
    if (e.target === m) {
      hideModal(m.id);
    }
  });
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    document.querySelectorAll(".modal").forEach(m => {
      if (!m.classList.contains("hidden")) {
        hideModal(m.id);
      }
    });
  }
});

window.addEventListener("popstate", () => {
  const params = new URLSearchParams(window.location.search);
  const requestedId = params.get("video");

  if (requestedId) {
    const video = videos.find(
      v => String(v.id) === requestedId
    );

    if (video) {
      showVideoPage(video, false, false);
    } else {
      showListingPage(false);
      updateMetaForMissingVideo();
    }
  } else {
    showListingPage(false);
  }
});

(async () => {
  await loadVideos();
})();

})();
</script>
